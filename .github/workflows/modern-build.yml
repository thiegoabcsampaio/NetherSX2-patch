name: Build modern APK
on:
  workflow_dispatch:
  push:
    paths: ['modern/**', '.github/workflows/modern-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android build-tools 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PASS: ${{ secrets.KS_PASS }}
        working-directory: modern
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_PASS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > nethersx2-modern.jks
            echo "KS_PASS=$SECRET_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: using a throwaway key (test build, cannot be updated in place)"
            P="$(openssl rand -hex 12)"; echo "::add-mask::$P"
            KS_PASS="$P" ./scripts/keystore-gen.sh
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi
      - name: Build and verify
        working-directory: modern
        run: ./scripts/build.sh && ./scripts/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NetherSX2-modern
          path: |
            modern/release/*.apk
            modern/release/SHA256SUMS
            modern/docs/manifest.diff
